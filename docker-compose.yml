services:
  api:
    build: .
    ports: ["8001:8001"]
    volumes: ["./models:/app/models", "./database:/app/database"]
  web:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["3001:5173"]
    depends_on: [api]
